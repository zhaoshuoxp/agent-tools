<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSH Connections</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: light-dark(#1c1c1e, #f4f4f5); background: transparent; }
    main { max-width: 560px; padding: clamp(24px, 7vw, 56px); margin: 8vh auto 0; }
    svg { width: 48px; height: 48px; margin-bottom: 22px; }
    h1 { margin: 0 0 12px; font-size: 30px; letter-spacing: -.7px; }
    p { margin: 0 0 24px; color: light-dark(#58585d, #b8b8c0); font-size: 17px; line-height: 1.6; }
    button { width: 100%; padding: 14px 20px; border: 0; border-radius: 12px; background: light-dark(#1c1c1e, #f4f4f5); color: light-dark(white, #1c1c1e); font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { opacity: .85; }
    button:focus-visible { outline: 3px solid #608eff; outline-offset: 4px; }
    button:disabled { cursor: wait; opacity: .5; }
    #status { margin: 20px 0 0; min-height: 48px; font-size: 14px; overflow-wrap: anywhere; }
    #status[data-error="true"] { color: light-dark(#a52b29, #ffaaa5); }
  </style>
</head>
<body>
  <main>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="4" width="20" height="16" rx="4"/><path d="m6 9 3 3-3 3m6 0h5"/>
    </svg>
    <h1>SSH Connections</h1>
    <p>Manage your hosts in Settings → Connections → SSH.</p>
    <button type="button" disabled>Open SSH settings</button>
    <p id="status" role="status" aria-live="polite">Opening SSH settings...</p>
  </main>
  <!-- WIDGET_SCRIPT -->
</body>
</html>
