<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage Meter</title>
  <style>:root {
  color-scheme: light dark;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  --surface: #ffffff;
  --ink: #1a2320;
  --muted: #66736d;
  --line: #e2e8e4;
  --soft: #f5f7f5;
  --accent: #0d6e59;
  --track: #e5eee8;
  --warning: #b26008;
}
@media (prefers-color-scheme: dark) {
  :root { --surface: #202321; --ink: #edf2ee; --muted: #acb8af; --line: #3b443e; --soft: #292f2b; --accent: #70d6af; --track: #3b4c41; --warning: #f4b96f; }
}
:root[data-theme="dark"] { --surface: #202321; --ink: #edf2ee; --muted: #acb8af; --line: #3b443e; --soft: #292f2b; --accent: #70d6af; --track: #3b4c41; --warning: #f4b96f; }
:root[data-theme="light"] { --surface: #ffffff; --ink: #1a2320; --muted: #66736d; --line: #e2e8e4; --soft: #f5f7f5; --accent: #0d6e59; --track: #e5eee8; --warning: #b26008; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); }
main { width: min(100%, 560px); padding: 26px 22px 20px; margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { margin: 0 0 6px; font-size: 11px; font-weight: 650; letter-spacing: .09em; color: var(--muted); }
h1 { font-size: 25px; letter-spacing: -.035em; font-weight: 650; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.icon-button { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); flex: 0 0 auto; }
.icon-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.status-row { display: flex; align-items: baseline; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 12px; color: var(--muted); margin: 20px 0 14px; }
#status::before { content: ""; display: inline-block; width: 6px; height: 6px; background: currentColor; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
#status[data-state="fresh"] { color: var(--accent); }
#status[data-state="stale"], .due { color: var(--warning); }
.bucket + .bucket { margin-top: 22px; }
.bucket-name { font-size: 14px; font-weight: 600; margin: 0 0 10px; color: var(--muted); overflow-wrap: anywhere; }
.window { border: 1px solid var(--line); border-radius: 14px; padding: 17px 18px; margin: 10px 0; }
.window-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.window-title { font-size: 17px; font-weight: 550; }
.percent { font-size: 32px; line-height: 1.15; font-weight: 600; letter-spacing: -.04em; white-space: nowrap; }
.percent.unknown { font-size: 14px; letter-spacing: 0; color: var(--muted); font-weight: 400; }
.used { font-size: 12px; font-weight: 400; margin-left: 4px; letter-spacing: 0; color: var(--muted); }
.track { height: 7px; background: var(--track); border-radius: 20px; margin-top: 14px; overflow: hidden; }
.track > div { height: 100%; background: var(--accent); border-radius: inherit; }
.track[data-high="true"] > div { background: var(--warning); }
.window-detail { margin: 11px 0 0; font-size: 12px; line-height: 1.65; color: var(--muted); overflow-wrap: anywhere; }
.next-reset { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 7px 12px; background: var(--soft); border-radius: 11px; padding: 13px 15px; font-size: 13px; margin-top: 12px; }
.next-reset strong { font-weight: 550; }
.next-reset span { color: var(--muted); }
.note, footer { font-size: 12px; color: var(--muted); line-height: 1.6; }
.note { margin: 9px 0 0; }
.pin-button { width: 100%; padding: 11px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 500; margin-top: 21px; }
.pin-button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
footer { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 19px; }
.error { border: 1px solid var(--line); padding: 12px; border-radius: 10px; font-size: 13px; line-height: 1.6; color: var(--warning); }
.empty { font-size: 14px; line-height: 1.6; padding: 14px 0; color: var(--muted); }
[hidden] { display: none !important; }
@media (max-width: 340px) {
  main { padding: 20px 14px 16px; }
  .window { padding: 15px; }
  .window-title { font-size: 16px; }
  .percent { font-size: 28px; }
}
</style>
</head>
<body>
  <main aria-label="Account usage">
    <header>
      <div><p class="eyebrow">CHATGPT WORK / CODEX</p><h1>Usage Meter</h1></div>
      <button id="refresh" class="icon-button" type="button" aria-label="Refresh usage" title="Refresh usage" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></svg>
      </button>
    </header>
    <div class="status-row"><span id="status" role="status">Connecting…</span><span id="updated"></span></div>
    <p id="error" class="error" role="alert" hidden></p>
    <div id="buckets"><p class="empty">Reading your current usage…</p></div>
    <button id="pin" class="pin-button" type="button" disabled>Show beside conversation context</button>
    <p id="pin-note" class="note">The summary includes its last update time.</p>
    <footer>Updates every minute while this view is open. Uses the current local account.</footer>
  </main>
