name: Agent Maintenance compatibility

on:
  push:
    branches: [main]
    paths: ['packages/agent-maintenance/**', '.github/workflows/agent-maintenance.yml']
  pull_request:
    paths: ['packages/agent-maintenance/**', '.github/workflows/agent-maintenance.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s packages/agent-maintenance -p test_maintenance.py -v
  desktop:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
      - name: Test with system Python
        run: /usr/bin/python3 -m unittest discover -s packages/agent-maintenance -p test_maintenance.py -v
      - name: Build and verify app
        run: |
          packages/agent-maintenance/desktop/build-app.sh "$RUNNER_TEMP/maintenance-app"
          /usr/bin/python3 packages/agent-maintenance/desktop/verify-app.py "$RUNNER_TEMP/maintenance-app/Agent Maintenance.app" --python /usr/bin/python3
      - name: Package and smoke-test installer with system Python
        run: |
          /usr/bin/python3 packages/agent-maintenance/package-distribution.py "$RUNNER_TEMP/maintenance-app/AgentMaintenance-macOS.zip" "$RUNNER_TEMP/distribution"
          package="$(find "$RUNNER_TEMP/distribution" -maxdepth 1 -type d -name 'AgentMaintenance-Test-*' | head -1)"
          AGENT_MAINTENANCE_PYTHON=/usr/bin/python3 bash "$package/Install.command" --app-dir "$RUNNER_TEMP/install-check/Applications" --cli-prefix "$RUNNER_TEMP/install-check/CLI" --bin-dir "$RUNNER_TEMP/install-check/bin"
      - uses: actions/upload-artifact@v7
        with:
          name: AgentMaintenance-macOS
          path: |
            ${{ runner.temp }}/maintenance-app/AgentMaintenance-macOS.zip
            ${{ runner.temp }}/distribution/*.zip
            ${{ runner.temp }}/distribution/*.sha256
          if-no-files-found: error
